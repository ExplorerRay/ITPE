---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prom-repo
        namespace: flux-system
  interval: 10m
  values:
    prometheus:
      service:
        type: LoadBalancer
    grafana:
      enabled: false
