apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kepler
  namespace: kepler
spec:
  releaseName: kepler
  chart:
    spec:
      chart: kepler
      sourceRef:
        kind: HelmRepository
        name: kepler-repo
  interval: 12h
  install:
    remediation:
      retries: 3
