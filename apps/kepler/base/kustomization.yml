apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ns.yml
  - rbac.yml
  - cm.yml
  - ds.yml
  - svc.yml
  - servicemonitor.yml
  - prometheus-rbac.yml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: kepler
      app.kubernetes.io/part-of: kepler
