apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
spec:
  values:
    ollama:
      gpu:
        enabled: true
        type: 'nvidia'
        number: 1
      # -- List of models to pull at container startup
      models:
        pull:
          - falcon:7b
          - mistral:7b
          - llama2:7b
